x-app: &app
  build: .
  image: bfiber:local
  pull_policy: build
  restart: unless-stopped
  env_file:
    - path: .env.production
  volumes:
    - ./storage:/app/storage

services:
  api:
    <<: *app
    container_name: bfiber-api
    command: ["serve"]
    ports:
      - "${APP_PORT:-3331}:3331"

  worker:
    <<: *app
    container_name: bfiber-worker
    command: ["queue:work"]
    depends_on:
      - api

networks:
  default:
    name: backend
    external: true

